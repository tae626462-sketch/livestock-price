name: อัปเดตราคาอัตโนมัติ
on:
  schedule:
    # ทุกวัน 07:13 09:13 11:13 14:13 16:13 น. เวลาไทย (GitHub ใช้เวลา UTC = ไทย − 7 ชม.)
    - cron: "13 0,2,4,7,9 * * *"
    # วันจันทร์ (CPF ประกาศราคาลูกสุกร) ทุกชั่วโมง 06:07 – 12:07 น. เวลาไทย
    # 06:07 ไทย = 23:07 UTC ของคืนวันอาทิตย์
    - cron: "7 23 * * 0"
    # 07:07 – 12:07 ไทย = 00:07 – 05:07 UTC วันจันทร์
    - cron: "7 0-5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ติดตั้งเครื่องมือ
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: ดึงราคาล่าสุด
        run: |
          mkdir -p scripts
          [ -f scripts/update_prices.py ] || cp update_prices.py scripts/update_prices.py
          python scripts/update_prices.py
      - name: บันทึก prices.json
        run: |
          git config user.name "vetvista-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "ไม่มีการเปลี่ยนแปลง"
          else
            git commit -m "อัปเดตราคา $(TZ=Asia/Bangkok date +'%Y-%m-%d %H:%M')"
            git push
          fi
