<title>กระดานราคาปศุสัตว์</title>

<style>
/* Layout: market price board — dark-green header band, figure tiles, sticky category chips, ruled price rows (like a ledger), tools at the end */
:root{
  --bg:#f1f4ee; --surface:#ffffff; --ink:#16231b; --muted:#5b6a60; --line:#d8dfd4;
  --band:#183b29; --band-ink:#eef4ea; --band-muted:#a9c2b0;
  --accent:#b9821a; --accent-soft:#f6ead0;
  --up:#1d7a45; --down:#c0392b; --flat:#7b867e; --warn:#a15c00; --warn-soft:#fbecd6;
  --bar:#2f6b47; --bar-prev:#c9d6cc;
  --f-display:"Chakra Petch","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17221b; --ink:#e6eee7; --muted:#9caaa0; --line:#2a3a30;
  --band:#0b2617; --band-ink:#e6efe6; --band-muted:#8fae99;
  --accent:#e2ad40; --accent-soft:#3a2e14;
  --up:#4cc27c; --down:#f07a6b; --flat:#8b978e; --warn:#f0a94a; --warn-soft:#3a2a12;
  --bar:#5fae7d; --bar-prev:#33463a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17221b; --ink:#e6eee7; --muted:#9caaa0; --line:#2a3a30;
  --band:#0b2617; --band-ink:#e6efe6; --band-muted:#8fae99;
  --accent:#e2ad40; --accent-soft:#3a2e14;
  --up:#4cc27c; --down:#f07a6b; --flat:#8b978e; --warn:#f0a94a; --warn-soft:#3a2a12;
  --bar:#5fae7d; --bar-prev:#33463a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:22px 18px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{display:block;height:28px;width:auto;max-width:100%;margin-bottom:12px}
.titlerow{display:flex;align-items:center;gap:12px;margin-top:2px}
.appicon{width:52px;height:52px;border-radius:13px;flex:0 0 auto;box-shadow:0 0 0 1px color-mix(in srgb,var(--band-ink) 18%,transparent)}
.titlerow h1{margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--band-muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.1;margin:2px 0 0;text-wrap:balance}
.meta{font-size:13px;color:var(--band-muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#1b1305}
.btn.ghost{background:transparent;border-color:color-mix(in srgb,var(--band-ink) 35%,transparent);color:var(--band-ink)}
.btn:disabled{opacity:.5;cursor:default}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:color-mix(in srgb,var(--band-ink) 7%,transparent);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lbl{font-size:13px;color:var(--band-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;font-weight:500;color:var(--band-muted);margin-left:4px;font-family:var(--f-body)}
.tile .chg{font-size:13px}
.tile .pm{font-size:12.5px;font-weight:600;color:#f8cf4a;font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* chips */
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0}
.sec-h .meta{color:var(--muted)}

/* ledger rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{font-weight:600}
.row .spec{font-size:13px;color:var(--muted)}
.row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.price{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
.chg{font-family:var(--f-display);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--flat)}
.band .chg.up{color:#7fe0a4} .band .chg.down{color:#ffa597} .band .chg.flat{color:var(--band-muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
.pill.old{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:var(--accent-soft);color:var(--accent)}
.spark{display:block}
.na{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:500}

/* pig region bars */
.regions{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px}
.rg{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:16px}
.track .p{position:absolute;left:0;top:5px;height:6px;background:var(--bar-prev);border-radius:3px}
.track .c{position:absolute;left:0;top:0;height:16px;background:var(--bar);border-radius:3px;opacity:.92}
.rg .val{text-align:right}
.rg .val .price{font-size:18px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* grade / ladder tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
td.n,th.n{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums}
td.n{font-weight:600;font-size:16px}
td.n.cheap{color:var(--accent)}
tr.grp th{background:var(--bg);font-family:var(--f-display);font-size:13px;color:var(--ink);letter-spacing:.04em;padding-block:6px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rung{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0}
.rung .sz{font-size:12px;color:var(--muted)}
.rung .price{font-size:19px}
.rung .dot{margin:2px auto 0;border-radius:50%;background:var(--accent)}
.note{font-size:13px;color:var(--muted);max-width:65ch}

.actions{display:flex;gap:8px;flex-wrap:wrap}
/* install */
.warnbox{margin:0;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;font-size:15px}
.steps b{font-family:var(--f-display)}
.appcard{display:flex;gap:12px;align-items:center}
.appcard img{width:56px;height:56px;border-radius:14px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--surface);font-size:13px}
/* share */
.sharegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sharegrid a,.sharegrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
.sharegrid .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px}
.invite{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;white-space:pre-line;line-height:1.6}
.qr{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.qr img{width:120px;height:120px;border-radius:8px;background:#fff;padding:6px}
/* ads */
.adband{background:var(--band)}
.adband .wrap{padding-block:0 18px;display:flex;flex-direction:column;gap:8px}
.adhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--band-muted)}
.adtag{display:inline-block;border:1px solid color-mix(in srgb,var(--band-muted) 60%,transparent);border-radius:4px;padding:0 6px;font-size:11px;letter-spacing:.06em;color:var(--band-muted)}
.car{position:relative;border-radius:var(--r);overflow:hidden;background:#0a1610}
.track2{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.track2::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/9;max-width:100%;border:0;padding:0;background:#0a1610;cursor:zoom-in;display:block}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.cbtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:color-mix(in srgb,#000 45%,transparent);color:#fff;font-size:18px;line-height:1}
.cbtn.prev{left:8px}.cbtn.next{right:8px}
@media (hover:none){.cbtn{display:none}}
.dots{display:flex;gap:6px;justify-content:center}
.dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:color-mix(in srgb,var(--band-ink) 30%,transparent)}
.dots button[aria-current="true"]{background:var(--accent);width:18px;border-radius:4px}
.capline{font-size:13px;color:var(--band-ink);min-height:1.5em}
.capline b{font-family:var(--f-display);letter-spacing:.02em}
.ad{margin:0;display:flex;flex-direction:column;gap:6px}
.ad button{border:0;padding:0;background:#0a1610;border-radius:var(--r);overflow:hidden;cursor:zoom-in;display:block;width:100%}
.ad img{width:100%;height:auto;display:block}
.ad figcaption{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad .adtag{color:var(--muted);border-color:var(--line)}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px}
/* bottom sheet (วิธีติดตั้ง) */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:center;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-width:720px;max-height:92%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.panel-b{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}

.sources{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sources a{color:var(--muted);word-break:break-word}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.credit{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:var(--band);color:var(--band-muted);border-radius:8px;padding:8px 12px;font-size:12px;letter-spacing:.04em}
.credit img{height:18px;width:auto}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .15s,color .15s}}
</style>

<header class="band">
  <div class="wrap">

function fmt(v,dp){if(v==null||isNaN(v))return"—";const d=dp!=null?dp:(Math.abs(v)>=100?0:(Number.isInteger(v)?0:2));return v.toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function parseRange(s){const m=String(s||"").replace(/,/g,"").match(/(\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?/);if(!m)return null;const lo=+m[1],hi=m[2]!=null?+m[2]:lo;return{lo,hi,mid:(lo+hi)/2}}
const item=id=>D.items.find(i=>i.id===id);

function change(it){
  const h=(it.hist||[]).filter(p=>p[1]!=null);
  if(h.length<2)return null;
  const a=h[h.length-2][1],b=h[h.length-1][1];return{d:b-a,pct:a?(b-a)/a*100:0,from:h[h.length-2][0]};
}
function chgHTML(c,dp){
  if(!c)return"";
  if(Math.abs(c.d)<1e-9)return`<span class="chg flat">━ ทรงตัว</span>`;
  const up=c.d>0;return`<span class="chg ${up?"up":"down"}">${up?"▲":"▼"} ${fmt(Math.abs(c.d),dp)}</span>`;
}
function fresh(iso){return !!iso&&daysAgo(iso)<=MAX_AGE}
const ok=it=>it&&it.price!=null&&fresh(it.date);
function spark(it){
  const h=(it.hist||[]).filter(p=>p[1]!=null);if(h.length<3)return"";
  const W=84,H=26,P=3,vs=h.map(p=>p[1]),mn=Math.min(...vs),mx=Math.max(...vs),rg=mx-mn||1;
  const pts=vs.map((v,i)=>[P+i*(W-2*P)/(vs.length-1),H-P-(v-mn)/rg*(H-2*P)]);
  const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
  const area=`${P},${H-P} ${line} ${W-P},${H-P}`;const e=pts[pts.length-1];
  return`<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="${area}" fill="var(--accent-soft)"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="2.6" fill="var(--accent)"/></svg>`;
}
function srcLink(k){const s=SRC[k];if(!s)return k?esc(k):"";return`<a href="${s.u}" target="_blank" rel="noopener">${esc(s.t.split(" — ")[0].split(" สรุป")[0])}</a>`}
function pigAvg(which){
  const vals=D.pig.rows.map(r=>parseRange(r[which])).filter(Boolean).map(x=>x.mid);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
const h3=t=>`<h3 style="font-family:var(--f-display);font-size:16px;margin:6px 0 0">${t}</h3>`;
const listOf=its=>{const v=its.filter(ok);return v.length?`<div class="list">${v.map(rowHTML).join("")}</div>`:""};

/* ---------- render ---------- */
function rowHTML(it){
  const dp=it.price<100&&!Number.isInteger(it.price)?2:undefined;
  const alt=it.alt?`<span class="sub num">${fmt(it.price*it.alt.k,0)} ${it.alt.u}</span>`:"";
  return`<div class="row">
    <div style="min-width:0"><div class="name">${esc(it.name)}</div>${it.spec?`<div class="spec">${esc(it.spec)}</div>`:""}</div>
    <div class="right"><span class="price">${fmt(it.price,dp)}</span><span class="unit">${esc(it.unit)}</span>${alt}</div>
    <div class="foot">${chgHTML(change(it),dp)}${spark(it)}<span>ข้อมูล ${thDate(it.date)}</span><span>${srcLink(it.src)}</span></div>
  </div>`;
}

function secPig(){
  const p=D.pig;let regions="";
  if(fresh(p.date)){
    const all=p.rows.flatMap(r=>[parseRange(r.cur),parseRange(r.prev)]).filter(Boolean);
    if(all.length){
      const mn=Math.floor(Math.min(...all.map(x=>x.lo),60)/5)*5-5,mx=Math.ceil(Math.max(...all.map(x=>x.hi))/5)*5;
      const pct=v=>Math.max(2,(v-mn)/(mx-mn)*100);
      const bars=p.rows.map(r=>{
        const c=parseRange(r.cur),pv=parseRange(r.prev);const d=c&&pv?c.mid-pv.mid:null;
        const chg=d==null?"":Math.abs(d)<1e-9?`<span class="chg flat">━</span>`:`<span class="chg ${d>0?"up":"down"}">${d>0?"▲":"▼"}${fmt(Math.abs(d))}</span>`;
        return`<div class="rg"><span>${esc(r.r)}</span>
          <div class="track">${pv?`<div class="p" style="width:${pct(pv.hi)}%"></div>`:""}${c?`<div class="c" style="width:${pct(c.hi)}%"></div>`:""}</div>
          <div class="val">${c?`<span class="price">${esc(r.cur)}</span> ${chg}`:`<span class="sub">${esc(r.cur||"—")}</span>`}</div></div>`}).join("");
      regions=`<div class="regions">
        <div class="legend"><span><i style="background:var(--bar)"></i>สุกรขุนหน้าฟาร์ม ${thDate(p.date)} (บาท/กก.)</span><span><i style="background:var(--bar-prev)"></i>รอบก่อน ${thDate(p.prevDate)}</span></div>
        ${bars}
        <div class="foot"><span>${esc(p.week)} · สมาคมผู้เลี้ยงสุกรแห่งชาติ ผ่าน ${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">ปศุสัตว์ดอทคอม</a>`:srcLink(p.src)}</span></div></div>`;
    }
  }
  const pl=D.items.filter(i=>i.cat==="piglet"&&ok(i));let plHTML="";
  if(pl.length){
    const kgOf=i=>i.kg||(i.pm?16:null);
    const rowP=i=>{const kg=kgOf(i);return`<tr><td>${esc(i.name)}<br><span class="sub">${esc(i.spec)}</span></td>
      <td class="n">${kg?kg+" กก.":"—"}</td>
      <td class="n">${fmt(i.price,0)}</td>
      <td class="n" style="font-size:14px">${i.pm?`±${fmt(i.pm,0)}<br><span class="sub">บาท/กก.</span>`:`<span class="sub">ราคาต่อตัว</span>`}</td>
      <td class="n">${chgHTML(change(i),0)||'<span class="chg flat">━</span>'}</td></tr>`};
    plHTML=`${h3("ลูกสุกร ซีพีเอฟ (บาท/ตัว)")}
    <div class="tbl-wrap"><table><thead><tr><th>ประเภท</th><th class="n">น้ำหนักฐาน</th><th class="n">ราคา</th><th class="n">บวก/ลบ</th><th class="n">เทียบสัปดาห์ก่อน</th></tr></thead><tbody>
    ${pl.map(rowP).join("")}
    </tbody></table></div>
    <div class="foot" style="font-size:12px;color:var(--muted)"><span>สัปดาห์ที่ ${pl[0].week??"—"} · ประกาศวันจันทร์ ${thDate(pl[0].date)}</span><span>${srcLink("cpffeed")}</span></div>`;
  }
  if(!(regions+plHTML).trim())return"";
  return secWrap("s-pig","สุกร","สุกรขุนประกาศทุกวันพระ · ลูกสุกรทุกวันจันทร์",regions+(regions?adFig("vistashape"):"")+plHTML+(plHTML?adFig("tributyrin"):""));
}

function secMeat(){

  if(R){
    const cell=(v,pv,other)=>{
      if(v==null)return`<td class="n"><span class="sub">—</span></td>`;
      const cheap=other!=null&&v<other;
      const d=pv!=null&&pv!==v?`<br><span class="chg ${v>pv?"up":"down"}">${v>pv?"▲":"▼"}${fmt(Math.abs(v-pv))}</span>`:"";
      return`<td class="n${cheap?" cheap":""}">${fmt(v)}${d}</td>`};
    const fv=(v,d)=>v!=null&&fresh(d||R.date)?v:null;
    const gs=R.groups.map(g=>({g:g.g,rows:g.rows.map(r=>({...r,makro:fv(r.makro,r.md),lotus:fv(r.lotus,r.ld)})).filter(r=>r.makro!=null||r.lotus!=null)})).filter(g=>g.rows.length);
    if(gs.length){

      <div class="tbl-wrap"><table><thead><tr><th>รายการ</th><th class="n">แม็คโคร</th><th class="n">โลตัส</th></tr></thead><tbody>
      ${gs.map(g=>`<tr class="grp"><th colspan="3">${esc(g.g)}</th></tr>`+g.rows.map(r=>`<tr><td>${esc(r.cut)}${r.sub?`<br><span class="sub">${esc(r.sub)}</span>`:""}</td>${cell(r.makro,r.pmakro,r.lotus)}${cell(r.lotus,r.plotus,r.makro)}</tr>`).join("")).join("")}
      </tbody></table></div>
      <div class="foot" style="font-size:12px;color:var(--muted)"><span>ข้อมูล ${thDate(R.date)} · ${esc(R.note||"")} · ตัวเลขสีทอง = ถูกกว่าอีกห้าง</span><span>${srcLink("makro")} · ${srcLink("lotus")}</span></div>`;
    }
  }
  const ref=D.items.filter(i=>i.cat==="meat"&&ok(i));
  const refHTML=ref.length?h3("ราคาอ้างอิงตลาด")+listOf(ref):"";
  const sh=D.items.filter(i=>i.cat==="shrimp"&&ok(i));let shHTML="";
  if(sh.length){
    const mx=Math.max(...sh.map(s=>s.price));
    shHTML=`${h3("กุ้งขาว ขายส่ง แยกขนาด (บาท/กก.)")}
      <div class="ladder" style="grid-template-columns:repeat(${sh.length},minmax(0,1fr))">${sh.map(s=>{const sz=8+(s.price/mx)*14;return`<div class="rung"><span class="sz">${esc(s.name)} ตัว/กก.</span><span class="price">${fmt(s.price,0)}</span>${chgHTML(change(s),0)||'<span class="chg flat">━</span>'}<span class="dot" style="width:${sz.toFixed(0)}px;height:${sz.toFixed(0)}px"></span></div>`}).join("")}</div>
      <div class="foot" style="font-size:12px;color:var(--muted)">ข้อมูล ${thDate(sh[0].date)} · ${srcLink(sh[0].src)}</div>`;
  }
  return secWrap("s-meat","เนื้อสัตว์","ขายปลีก / ขายส่ง",retail+refHTML+shHTML);
}

(function(){
  const car=document.getElementById("car"),dots=document.getElementById("carDots"),cap=document.getElementById("carCap");
  car.innerHTML=ADS.map((a,i)=>`<button class="slide" type="button" data-ad="${a.id}" aria-label="${i+1}/${ADS.length} ${esc(a.t)} แตะเพื่อดูภาพเต็ม"><img src="${a.src}" alt="${esc(a.t+" "+a.d)}" width="${a.w}" height="${a.h}"${i?' loading="lazy"':''}></button>`).join("");
  dots.innerHTML=ADS.map((a,i)=>`<button type="button" data-i="${i}" aria-label="ไปภาพที่ ${i+1}"></button>`).join("");
  let cur=0,timer=null;
  const setCur=i=>{cur=i;[...dots.children].forEach((d,k)=>d.setAttribute("aria-current",k===i));const a=ADS[i];cap.innerHTML=`<b>${esc(a.t)}</b> · ${esc(a.d)}`};
  const go=i=>{i=(i+ADS.length)%ADS.length;car.scrollTo({left:i*car.clientWidth});setCur(i)};
  car.addEventListener("scroll",()=>{const i=Math.round(car.scrollLeft/Math.max(1,car.clientWidth));if(i!==cur&&i>=0&&i<ADS.length)setCur(i)},{passive:true});
  dots.addEventListener("click",e=>{const b=e.target.closest("button");if(b){go(+b.dataset.i);restart()}});
  document.getElementById("carPrev").addEventListener("click",()=>{go(cur-1);restart()});
  document.getElementById("carNext").addEventListener("click",()=>{go(cur+1);restart()});
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function restart(){clearInterval(timer);if(!reduce)timer=setInterval(()=>{if(!document.hidden)go(cur+1)},2000)}
  car.addEventListener("pointerdown",restart);
  setCur(0);restart();
  const lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg");
  document.addEventListener("click",e=>{const b=e.target.closest("[data-ad]");if(!b)return;const a=ad(b.dataset.ad);lbImg.src=a.src;lbImg.alt=a.t+" "+a.d;lb.hidden=false;clearInterval(timer)});
  const closeLb=()=>{lb.hidden=true;restart()};
  document.getElementById("lbClose").addEventListener("click",closeLb);
  lb.addEventListener("click",e=>{if(e.target===lb)closeLb()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!lb.hidden)closeLb()});
})();

  function open(){
    body.innerHTML=`
      <div class="sharegrid">
        <a href="https://social-plugins.line.me/lineit/share?url=${enc(INSTALL_URL)}&text=${enc(INVITE)}" target="_blank" rel="noopener"><span class="ico" style="background:#06c755">L</span>LINE</a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${enc(INSTALL_URL)}" target="_blank" rel="noopener"><span class="ico" style="background:#1877f2">f</span>Facebook</a>
        <button type="button" id="shrCopyAll"><span class="ico" style="background:var(--band)">⧉</span>คัดลอกข้อความ</button>
      </div>
      <div class="linkbox"><input id="shrUrl" readonly value="${INSTALL_URL}" aria-label="ลิงก์ติดตั้งแอพ"><button class="btn" type="button" id="shrCopy">คัดลอกลิงก์</button></div>
      <div class="invite" id="shrText">${esc(INVITE)}</div>
      ${qr?`<div class="qr"><img src="${qr}" alt="QR ติดตั้งแอพ"><span>สแกน QR เพื่อเปิดและติดตั้งแอพ ใช้พิมพ์ติดถุงสินค้า โบรชัวร์ หรือหน้าร้าน</span></div>`:""}`;
    sh.hidden=false;
  }
  async function copy(t,el){
    try{await navigator.clipboard.writeText(t);toast("คัดลอกแล้ว")}
    catch(e){if(el&&el.select){el.select();toast("เลือกข้อความแล้ว กดคัดลอกได้เลย")}else{const r=document.createRange();r.selectNodeContents(document.getElementById("shrText"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("เลือกข้อความแล้ว กดคัดลอกได้เลย")}}
  }
  document.getElementById("shareBtn").addEventListener("click",async()=>{
    track("/share-click","กดปุ่มแชร์แอพ",true);
    if(navigator.share&&/github\.io$/.test(location.hostname)){
      try{await navigator.share({title:"ราคาปศุสัตว์ by VET VISTA",text:INVITE.replace(/\n👉[^\n]*/,""),url:INSTALL_URL});return}catch(e){if(e&&e.name==="AbortError")return}
    }
    open();
  });
  body.addEventListener("click",e=>{
    if(e.target.closest("#shrCopy"))copy(INSTALL_URL,document.getElementById("shrUrl"));
    if(e.target.closest("#shrCopyAll"))copy(INVITE);
  });
  document.getElementById("shrClose").addEventListener("click",()=>{sh.hidden=true});
  sh.addEventListener("click",e=>{if(e.target===sh)sh.hidden=true});
})();

/* ---------- ติดตั้งแอพ (PWA) ---------- */
(function(){
  const btn=document.getElementById("installBtn"),sh=document.getElementById("inst"),body=document.getElementById("instBody");
  const ua=navigator.userAgent||"";
  const isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const inApp=/FBAN|FBAV|FB_IAB|FB4A|Instagram|Line\/|MicroMessenger|TikTok|; wv\)/i.test(ua);
  const isLINE=/Line\//i.test(ua), isAndroid=/Android/i.test(ua);
  const cleanUrl=APP_URL+"?install=1";
  /* เปิดหน้านี้ใน Chrome / เบราว์เซอร์หลัก (เลี่ยงการติดตั้งผ่านเบราว์เซอร์ในแอพ ซึ่ง Google Play Protect บล็อก) */
  function openExternal(){
    if(isLINE){location.href=APP_URL+"?install=1&openExternalBrowser=1";return}
    if(isAndroid){const u=new URL(cleanUrl);location.href=`intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(cleanUrl)};end`;return}
  }
  const standalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
  let deferred=null;
  if(standalone())btn.hidden=true;
  if(inApp&&(isAndroid||isLINE))btn.textContent="⤓ เปิดใน Chrome เพื่อติดตั้ง";
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;btn.hidden=false});
  window.addEventListener("appinstalled",()=>{track("/install-android","ติดตั้งสำเร็จ (Android/คอมพิวเตอร์)",true);btn.hidden=true;deferred=null;toast("ติดตั้งแอพแล้ว เปิดได้จากหน้าจอโฮม")});
  const icon=document.querySelector(".brand")?.src||"";
  function steps(){
    const now=deferred?`<button class="btn gold" type="button" id="instNow" style="align-self:flex-start;font-size:16px;padding:10px 20px">⤓ ติดตั้งเลย</button>`:"";
    const head=now+`<div class="appcard"><div><b style="font-family:var(--f-display);font-size:16px">กระดานราคาปศุสัตว์</b><div class="sub">by VET VISTA · เปิดเร็วเหมือนแอพ ดูราคาได้ทุกสัปดาห์</div></div></div>`;
    if(inApp)return head+`<p class="note warnbox">⚠️ ตอนนี้เปิดอยู่ในแอพ Facebook / LINE ห้ามกด "เพิ่มไปยังหน้าจอหลัก" จากเมนูของแอพเหล่านี้ เพราะ Google Play Protect จะบล็อกแอพ ให้ติดตั้งผ่าน ${isIOS?"Safari":"Chrome"} เท่านั้น</p>
      ${isAndroid||isLINE?`<button class="btn gold" type="button" id="openExt" style="align-self:flex-start;font-size:16px;padding:10px 20px">เปิดใน ${isIOS?"Safari":"Chrome"}</button>`:""}
      <ol class="steps"><li>ถ้ากดปุ่มแล้วไม่เปิด ให้กด <b>⋯</b> หรือ <b>⋮</b> มุมขวาบน</li><li>เลือก <b>เปิดในเบราว์เซอร์</b> หรือ <b>เปิดใน ${isIOS?"Safari":"Chrome"}</b></li><li>หน้าติดตั้งจะขึ้นเอง กด <b>ติดตั้ง</b></li></ol>`;
    if(isIOS)return head+`<ol class="steps"><li>เปิดหน้านี้ใน <b>Safari</b></li><li>กดปุ่มแชร์ <span class="kbd">⬆︎</span> ด้านล่างจอ</li><li>เลื่อนลงแล้วเลือก <b>เพิ่มไปยังหน้าจอโฮม</b></li><li>กด <b>เพิ่ม</b> ไอคอนราคาปศุสัตว์จะขึ้นบนหน้าจอ</li></ol>`;
    return head+`<ol class="steps"><li>เปิดหน้านี้ใน <b>Chrome</b></li><li>กดเมนู <span class="kbd">⋮</span> มุมขวาบน</li><li>เลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b></li><li>กด <b>ติดตั้ง</b> ไอคอนราคาปศุสัตว์จะขึ้นบนหน้าจอ</li></ol>`;
  }
  btn.addEventListener("click",async()=>{
    track("/install-click","กดปุ่มติดตั้งแอพ",true);
    if(inApp&&(isAndroid||isLINE)){openExternal();setTimeout(()=>{body.innerHTML=steps();sh.hidden=false},700);return}
    if(deferred){try{deferred.prompt();const r=await deferred.userChoice;if(r&&r.outcome==="accepted")btn.hidden=true}catch(e){}deferred=null;return}
    body.innerHTML=steps();sh.hidden=false;
  });
  /* เปิดจากลิงก์ชวน (…/#install) แล้วขึ้นวิธีติดตั้งให้ทันที */
  let wantInstall=false;try{wantInstall=location.hash==="#install"||new URLSearchParams(location.search).has("install")}catch(e){}
  /* ลิงก์เดิม (…/#install) ที่เปิดในแอพ LINE / Facebook: พาออกไปเปิดในเบราว์เซอร์หลักให้อัตโนมัติ 1 ครั้ง */
  try{
    if(wantInstall&&inApp&&!standalone()&&!sessionStorage.getItem("vv-ext-tried")){
      sessionStorage.setItem("vv-ext-tried","1");
      if(isLINE&&!/openExternalBrowser=1/.test(location.search)){location.replace(APP_URL+"?install=1&openExternalBrowser=1")}
      else if(isAndroid&&!isLINE){setTimeout(openExternal,300)}
    }
  }catch(e){}
  try{if(wantInstall&&!standalone()){setTimeout(()=>{body.innerHTML=steps();sh.hidden=false},900)}}catch(e){}
  body.addEventListener("click",async e=>{if(e.target.closest("#openExt")){openExternal();return}if(e.target.closest("#instNow")&&deferred){try{deferred.prompt();const r=await deferred.userChoice;if(r&&r.outcome==="accepted"){btn.hidden=true;sh.hidden=true}}catch(err){}deferred=null}});
  const close=()=>{sh.hidden=true};
  document.getElementById("instClose").addEventListener("click",close);
  sh.addEventListener("click",e=>{if(e.target===sh)close()});
  try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
})();

/* ---------- boot: prices.json จากระบบอัปเดตอัตโนมัติ > ข้อมูลตั้งต้นในไฟล์ ---------- */
(function boot(){
  render();
  if(location.protocol.startsWith("http")){
    fetch("prices.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
      if(j&&Array.isArray(j.items)&&j.pig&&j.retail&&(j.updated||"")>=(D.updated||"")){D=j;render()}
    }).catch(()=>{});
  }
})();
</script>
